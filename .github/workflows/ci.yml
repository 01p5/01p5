name: CI

# W1-2 plan item: ruff + pytest on every push/PR.
# Scope is intentionally minimal — lint and unit-test the agentlib core
# (no LLM calls, no kubectl). Integration tests against real providers
# come in W3-4 once we have the orchestrator wired to AWS.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    defaults:
      run:
        working-directory: libs/agentlib
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install minimal test dependencies
        # We deliberately do NOT install the full pinned dependency set
        # (langchain 1.x, litellm, anthropic, etc.) — the unit tests cover
        # the pure-python core (spec, runtime, bus, orchestrator, budget)
        # and only need langchain.tools + pydantic. textual is required
        # by the TUI tests in olympus_cli; pytest-cov gates the 80%
        # coverage thresholds below.
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest pytest-cov pydantic 'langchain>=0.3,<2.0' 'langchain-core>=0.3,<2.0' fakeredis textual wsproto

      - name: Lint (ruff)
        run: ruff check src tests

      # Each suite enforces ≥80% coverage on its own src/ tree via
      # --cov-fail-under. The threshold matches the team policy: any
      # package falling below 80% fails CI. To lift the bar, write
      # tests; to drop it (e.g. for a brand-new package not yet
      # rounded out), update the matching --cov-fail-under here.

      - name: Test agentlib core (pytest + 80% coverage gate)
        run: pytest -v --cov=src --cov-report=term --cov-fail-under=80

      - name: Test sysadmin agent (pytest + 80% coverage gate)
        working-directory: agents/sysadmin
        run: pytest -v --cov=src --cov-report=term --cov-fail-under=80

      - name: Test programmer agent (pytest + 80% coverage gate)
        working-directory: agents/programmer
        run: pytest -v --cov=src --cov-report=term --cov-fail-under=80

      - name: Test terraform agent (pytest + 80% coverage gate)
        working-directory: agents/terraform
        run: pytest -v --cov=src --cov-report=term --cov-fail-under=80

      - name: Test ansible agent (pytest + 80% coverage gate)
        working-directory: agents/ansible
        run: pytest -v --cov=src --cov-report=term --cov-fail-under=80

      - name: Test hpc agent (pytest + 80% coverage gate)
        working-directory: agents/hpc
        run: pytest -v --cov=src --cov-report=term --cov-fail-under=80

      - name: Test main agent (pytest + 80% coverage gate)
        working-directory: agents/main
        run: pytest -v --cov=src --cov-report=term --cov-fail-under=80

      - name: Test orchestrator CLI wiring (pytest + 80% coverage gate)
        working-directory: agents/olympus_cli
        run: pytest -v --cov=src --cov-report=term --cov-fail-under=80

      - name: Test terminal_companion agent (pytest + 80% coverage gate)
        working-directory: agents/terminal_companion
        run: pytest -v --cov=src --cov-report=term --cov-fail-under=80

      - name: Test dashboard backend (pytest + 80% coverage gate)
        working-directory: agents/dashboard
        run: pytest -v --cov=src --cov-report=term --cov-fail-under=80

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agents/dashboard/frontend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: agents/dashboard/frontend/package-lock.json
      - name: Install
        run: npm ci || npm install
      - name: Unit tests + 80% coverage gate (vitest)
        # `test:coverage` runs vitest with the v8 coverage provider; the
        # thresholds in vitest.config.ts (statements/lines/functions/
        # branches all at 80%) turn this into a hard CI gate. A drop
        # below 80% on any metric fails the job.
        run: npm run test:coverage
      - name: Type-check + build
        run: npm run build
      - name: Confirm SPA artifacts
        run: |
          test -f ../static/dist/index.html
          ls ../static/dist/assets/*.js
          ls ../static/dist/assets/*.css
