# Default values for the Olympus chart.
#
# This is a *minimum-viable* deploy: one Deployment for the dashboard
# (which embeds the orchestrator + bus + the four agent runtimes), one
# Service exposing it, an optional Ingress. Per-agent deployments + a
# Redis bus are stretch — they slot into this chart in W7+.

image:
  repository: olympus/dashboard
  tag: dev
  pullPolicy: IfNotPresent

dashboard:
  replicas: 1
  port: 8765
  router: llm           # "llm" or "manual"
  auditLogPath: /var/lib/olympus/audit.jsonl
  # User-managed hosts + ssh keys (Phase INV). File sits in the same
  # mounted volume as the audit log so one PVC (audit.persistence)
  # handles both. Key PEMs live in {dir}/keys/{key_id}, mode 0600.
  inventoryPath: /var/lib/olympus/inventory.json
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits:   { cpu: 1,    memory: 1Gi }

# Pull provider keys from a Secret named ``{{ release }}-secrets`` in
# the same namespace. Create the Secret out-of-band; the chart never
# templates raw keys.
#
# `sshPrivateKeyKey` is optional — when set AND the named key exists in
# the secret, the deployment mounts it at /etc/olympus/ssh/<filename>
# (mode 0600) so the Ansible agent can SSH into cluster nodes via the
# bundled inventory. Set to "" to skip mounting.
secrets:
  secretName: ""        # "" → defaults to "{{ release }}-secrets"
  anthropicApiKeyKey: anthropic_api_key
  openaiApiKeyKey:    openai_api_key
  sshPrivateKeyKey:   ssh_k8s_pem
  sshPrivateKeyMount: /etc/olympus/ssh/k8s.pem
  # Auth secrets — looked up by key in the same olympus-secrets Secret.
  # Leave a key empty to omit it (the corresponding env stays unset).
  sessionSecretKey:        session_secret          # OLYMPUS_AUTH_SESSION_SECRET
  googleClientIdKey:       google_client_id        # OLYMPUS_AUTH_GOOGLE_CLIENT_ID
  googleClientSecretKey:   google_client_secret    # OLYMPUS_AUTH_GOOGLE_CLIENT_SECRET
  smtpPasswordKey:         smtp_password           # OLYMPUS_AUTH_SMTP_PASSWORD

# Auth (Phases A-C). Non-secret values; the secret-backed pieces live in
# `secrets` above. Leave allowedDomains empty + bypass=true for local dev.
auth:
  bypass: false                  # OLYMPUS_AUTH_BYPASS — true skips auth entirely
  allowedDomains: ""             # OLYMPUS_AUTH_ALLOWED_DOMAINS — csv: "stanford.edu,tianleyu.com"
  redirectBaseUrl: ""            # OLYMPUS_AUTH_REDIRECT_BASE_URL — e.g. https://0lympu5.com
  cookieSecure: true             # OLYMPUS_AUTH_COOKIE_SECURE — keep true behind TLS
  sessionTtlSeconds: 604800      # 7 days
  smtpHost: ""                   # OLYMPUS_AUTH_SMTP_HOST — empty disables email-OTP
  smtpPort: 587
  smtpUsername: ""
  smtpFrom: ""
  smtpStarttls: true
  otpTtlSeconds: 600
  otpRateLimitSeconds: 60

# Hardening (Phase D). Both default-off so dev runs aren't surprised.
hardening:
  demoMode: false                # OLYMPUS_DEMO_MODE — auto-rejects destructive verbs
  dailyCostCapUsd: ""            # OLYMPUS_DAILY_COST_CAP_USD — empty disables the cap


# Persistent audit log volume. emptyDir by default for the smoke deploy;
# a real cluster should swap in a PVC.
audit:
  persistence:
    enabled: false
    size: 1Gi
    storageClass: ""

service:
  type: ClusterIP
  port: 80
  targetPort: 8765

ingress:
  enabled: false
  className: ""
  host: olympus.example.com
  tls: false

serviceAccount:
  # The serviceAccount the agents run as. Sysadmin agent calls kubectl
  # via in-cluster credentials; bind only the verbs it actually needs.
  create: true
  name: ""              # "" → defaults to "{{ release }}-agent"

# RBAC granted to the agent's serviceAccount. Read-only by default; the
# user explicitly opts into mutation by enabling .destructive=true.
rbac:
  create: true
  destructive: false    # true → grants delete on pods (gated by ApprovalHook anyway)
