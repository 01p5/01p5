apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "olympus.fullname" . }}
  labels: {{- include "olympus.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.dashboard.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels: {{- include "olympus.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "olympus.serviceAccountName" . }}
      containers:
        - name: dashboard
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["olympus-dashboard"]
          args:
            - --host=0.0.0.0
            - --port={{ .Values.dashboard.port }}
            - --router={{ .Values.dashboard.router }}
            - --audit-log={{ .Values.dashboard.auditLogPath }}
          ports:
            - name: http
              containerPort: {{ .Values.dashboard.port }}
          env:
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "olympus.secretName" . }}
                  key:  {{ .Values.secrets.anthropicApiKeyKey }}
                  optional: true
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "olympus.secretName" . }}
                  key:  {{ .Values.secrets.openaiApiKeyKey }}
                  optional: true
            # --- Auth (Phases A-C) ---
            - name: OLYMPUS_AUTH_BYPASS
              value: {{ .Values.auth.bypass | quote }}
            - name: OLYMPUS_AUTH_ALLOWED_DOMAINS
              value: {{ .Values.auth.allowedDomains | quote }}
            - name: OLYMPUS_AUTH_REDIRECT_BASE_URL
              value: {{ .Values.auth.redirectBaseUrl | quote }}
            - name: OLYMPUS_AUTH_COOKIE_SECURE
              value: {{ .Values.auth.cookieSecure | quote }}
            - name: OLYMPUS_AUTH_SESSION_TTL_SECONDS
              value: {{ .Values.auth.sessionTtlSeconds | quote }}
            {{- if .Values.secrets.sessionSecretKey }}
            - name: OLYMPUS_AUTH_SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "olympus.secretName" . }}
                  key:  {{ .Values.secrets.sessionSecretKey }}
                  optional: true
            {{- end }}
            {{- if .Values.secrets.googleClientIdKey }}
            - name: OLYMPUS_AUTH_GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "olympus.secretName" . }}
                  key:  {{ .Values.secrets.googleClientIdKey }}
                  optional: true
            {{- end }}
            {{- if .Values.secrets.googleClientSecretKey }}
            - name: OLYMPUS_AUTH_GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "olympus.secretName" . }}
                  key:  {{ .Values.secrets.googleClientSecretKey }}
                  optional: true
            {{- end }}
            # --- Email-OTP (Phase B) ---
            - name: OLYMPUS_AUTH_SMTP_HOST
              value: {{ .Values.auth.smtpHost | quote }}
            - name: OLYMPUS_AUTH_SMTP_PORT
              value: {{ .Values.auth.smtpPort | quote }}
            - name: OLYMPUS_AUTH_SMTP_USERNAME
              value: {{ .Values.auth.smtpUsername | quote }}
            - name: OLYMPUS_AUTH_SMTP_FROM
              value: {{ .Values.auth.smtpFrom | quote }}
            - name: OLYMPUS_AUTH_SMTP_STARTTLS
              value: {{ .Values.auth.smtpStarttls | quote }}
            - name: OLYMPUS_AUTH_OTP_TTL_SECONDS
              value: {{ .Values.auth.otpTtlSeconds | quote }}
            - name: OLYMPUS_AUTH_OTP_RATE_LIMIT_SECONDS
              value: {{ .Values.auth.otpRateLimitSeconds | quote }}
            {{- if .Values.secrets.smtpPasswordKey }}
            - name: OLYMPUS_AUTH_SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "olympus.secretName" . }}
                  key:  {{ .Values.secrets.smtpPasswordKey }}
                  optional: true
            {{- end }}
            # --- Hardening (Phase D) ---
            - name: OLYMPUS_DEMO_MODE
              value: {{ .Values.hardening.demoMode | quote }}
            - name: OLYMPUS_DAILY_COST_CAP_USD
              value: {{ .Values.hardening.dailyCostCapUsd | quote }}
            # --- Inventory (Phase INV) ---
            # User-managed hosts + ssh keys file. Sibling of the audit
            # log so a single mounted volume (audit.persistence) covers
            # both. Per-key PEM bodies live in {dir}/keys/{key_id}.
            - name: OLYMPUS_INVENTORY_PATH
              value: {{ .Values.dashboard.inventoryPath | quote }}
            {{- with .Values.extraEnv }}
            # extraEnv — generic Helm extension. Per-deploy env vars
            # the chart itself doesn't know about (e.g. sandbox demo
            # extends PATH so mounted demo MCP binaries are discoverable).
            {{- toYaml . | nindent 12 }}
            {{- end }}
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 10
            periodSeconds: 30
          resources: {{- toYaml .Values.dashboard.resources | nindent 12 }}
          volumeMounts:
            - name: audit
              mountPath: /var/lib/olympus
            {{- if .Values.secrets.sshPrivateKeyKey }}
            - name: ssh-key
              mountPath: {{ .Values.secrets.sshPrivateKeyMount }}
              subPath: {{ .Values.secrets.sshPrivateKeyKey }}
              readOnly: true
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: audit
          {{- if .Values.audit.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "olympus.fullname" . }}-audit
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- if .Values.secrets.sshPrivateKeyKey }}
        - name: ssh-key
          secret:
            secretName: {{ include "olympus.secretName" . }}
            # 0600 — SSH refuses to use a key world-readable, so this
            # has to be octal 384 (== 0o600). Optional=true so a
            # missing key just leaves /etc/olympus/ssh empty rather
            # than blocking the pod from starting.
            defaultMode: 384
            optional: true
            items:
              - key: {{ .Values.secrets.sshPrivateKeyKey }}
                path: {{ .Values.secrets.sshPrivateKeyKey }}
        {{- end }}
        {{- with .Values.extraVolumes }}
        # extraVolumes — generic Helm extension. Pair with extraVolumeMounts
        # above to expose per-deploy data (e.g. sandbox demo MCP binaries
        # in a ConfigMap mounted as 0755 + put on PATH via extraEnv).
        {{- toYaml . | nindent 8 }}
        {{- end }}
{{- if .Values.audit.persistence.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "olympus.fullname" . }}-audit
  labels: {{- include "olympus.labels" . | nindent 4 }}
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: {{ .Values.audit.persistence.size }}
  {{- with .Values.audit.persistence.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
{{- end }}
