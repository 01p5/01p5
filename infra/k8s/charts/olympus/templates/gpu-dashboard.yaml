{{- if .Values.gpuDashboard.enabled }}
# S2.C1 — gpu-dashboard sibling. Same shape as slurm-dashboard.yaml.
# Optional; default off. Reverse-proxied under Olympus at /gpu/*.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "olympus.fullname" . }}-gpu-dashboard
  labels: {{- include "olympus.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}-gpu-dashboard
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}-gpu-dashboard
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: gpu-dashboard
          image: "{{ .Values.gpuDashboard.image.repository }}:{{ .Values.gpuDashboard.image.tag }}"
          imagePullPolicy: {{ .Values.gpuDashboard.image.pullPolicy }}
          command: ["gpu-dashboard"]
          args:
            - --host=0.0.0.0
            - --port={{ .Values.gpuDashboard.port }}
          ports:
            - name: http
              containerPort: {{ .Values.gpuDashboard.port }}
          env:
            # See slurm-dashboard.yaml — hostsSecret makes the node
            # registry read-only + pre-seeded so gpu-mcp works after any
            # restart with no manual re-seed.
            - name: GPU_WATCH_HOSTS
              {{- if .Values.gpuDashboard.hostsSecret }}
              value: /etc/gpu-watch/{{ .Values.gpuDashboard.hostsSecretKey }}
              {{- else }}
              value: /var/lib/gpu-watch/hosts.json
              {{- end }}
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 10
            periodSeconds: 30
          resources: {{- toYaml .Values.gpuDashboard.resources | nindent 12 }}
          volumeMounts:
            - name: hosts
              mountPath: /var/lib/gpu-watch
            {{- if .Values.gpuDashboard.hostsSecret }}
            - name: hosts-seed
              mountPath: /etc/gpu-watch
              readOnly: true
            {{- end }}
            {{- if .Values.secrets.sshPrivateKeyKey }}
            - name: ssh-key
              mountPath: {{ .Values.secrets.sshPrivateKeyMount }}
              subPath: {{ .Values.secrets.sshPrivateKeyKey }}
              readOnly: true
            {{- end }}
      volumes:
        - name: hosts
          {{- if .Values.gpuDashboard.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "olympus.fullname" . }}-gpu-dashboard-hosts
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- if .Values.gpuDashboard.hostsSecret }}
        - name: hosts-seed
          secret:
            secretName: {{ .Values.gpuDashboard.hostsSecret }}
            optional: true
            items:
              - key: {{ .Values.gpuDashboard.hostsSecretKey }}
                path: {{ .Values.gpuDashboard.hostsSecretKey }}
        {{- end }}
        {{- if .Values.secrets.sshPrivateKeyKey }}
        - name: ssh-key
          secret:
            secretName: {{ include "olympus.secretName" . }}
            defaultMode: 384  # 0o600
            optional: true
            items:
              - key: {{ .Values.secrets.sshPrivateKeyKey }}
                path: {{ .Values.secrets.sshPrivateKeyKey }}
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "olympus.fullname" . }}-gpu-dashboard
  labels: {{- include "olympus.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.gpuDashboard.port }}
      targetPort: http
      name: http
  selector:
    app.kubernetes.io/name: {{ .Chart.Name }}-gpu-dashboard
    app.kubernetes.io/instance: {{ .Release.Name }}
{{- if .Values.gpuDashboard.persistence.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "olympus.fullname" . }}-gpu-dashboard-hosts
  labels: {{- include "olympus.labels" . | nindent 4 }}
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: {{ .Values.gpuDashboard.persistence.size }}
  {{- with .Values.gpuDashboard.persistence.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
{{- end }}
{{- end }}
