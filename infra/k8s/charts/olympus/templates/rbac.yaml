{{- if .Values.rbac.create -}}
# SELF-PROTECTION INVARIANT (do not loosen): this SA must NEVER be granted
#   - any verb on `secrets` (would let an agent read its own creds), or
#   - any write verb in apiGroup `rbac.authorization.k8s.io` (self-escalation).
# It deliberately has neither below. This is the k8s-RBAC layer of the
# self-management guard; the runtime agentlib.SelfProtectionPolicy is the other.
#
# Namespaced Role: pod/event/log read (and optional delete) within
# the release namespace. The sysadmin agent's pod-facing tools all
# scope to a single namespace argument, so this is the natural fit.
# Note: the runtime policy also hard-denies delete_pod in the release
# (self) + kube-system namespaces, so this Role + the policy are two
# independent layers over the same action.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "olympus.fullname" . }}-sysadmin
  labels: {{- include "olympus.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "events"]
    verbs:     ["get", "list", "watch"]
  {{- if .Values.rbac.destructive }}
  - apiGroups: [""]
    resources: ["pods"]
    verbs:     ["delete"]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "olympus.fullname" . }}-sysadmin
  labels: {{- include "olympus.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "olympus.serviceAccountName" . }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "olympus.fullname" . }}-sysadmin
---
# ClusterRole for cluster-scoped resources the sysadmin agent reads.
# `nodes` is cluster-scoped and cannot be authorized by a namespaced
# Role at all — k8s rejects the binding. Keep this strictly read-only;
# no destructive cluster verbs are ever needed for the dashboard's
# current toolset.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "olympus.fullname" . }}-sysadmin-cluster
  labels: {{- include "olympus.labels" . | nindent 4 }}
rules:
  # Cluster-scoped reads. ``nodes`` is the original case (cannot be
  # authorized by a namespaced Role); the rest unblock the Kubernetes UI
  # in a multi-namespace cluster where the dashboard's `namespace`
  # selector points at something other than the release namespace.
  # Strictly read-only; destructive verbs stay namespace-scoped + gated.
  - apiGroups: [""]
    resources: ["nodes", "namespaces"]
    verbs:     ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods", "pods/log", "events", "services", "configmaps"]
    verbs:     ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "daemonsets", "statefulsets"]
    verbs:     ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs:     ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "olympus.fullname" . }}-sysadmin-cluster
  labels: {{- include "olympus.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "olympus.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "olympus.fullname" . }}-sysadmin-cluster
{{- end }}
