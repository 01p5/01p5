[build-system]
requires = ["setuptools>=64.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "olympus-dashboard"
version = "0.1.0"
description = "Olympus web dashboard — task submission, live agent activity, approval queue, audit viewer"
requires-python = ">=3.10"
license = {text = "MIT"}

dependencies = [
    "agentlib",
    "olympus-cli",
    # Verifies Google's id_token signatures for the OAuth sign-in path.
    "google-auth>=2.30",
    # Sans-IO WebSocket protocol parser used by the terminal bridge
    # (TERM.2b). Tiny lib (only depends on h11), drives both server and
    # client handshake + frame parsing.
    "wsproto>=1.2",
    # Pull-based LLM observer over terminal scrollback (TERM.4).
    "olympus-terminal-companion",
]

[project.scripts]
olympus-dashboard = "dashboard.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
