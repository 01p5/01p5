[build-system]
requires = ["setuptools>=64.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "olympus-main"
version = "0.1.0"
description = "Olympus main agent — generalist coordinator that converses with the human and dispatches specialist sub-agents within a group-chat ticket."
requires-python = ">=3.10"
license = {text = "MIT"}

dependencies = [
    "agentlib",
    "pydantic>=2.0",
]

[project.scripts]
olympus-main = "main_agent.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
